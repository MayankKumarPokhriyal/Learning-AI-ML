[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rag-assistant"
version = "1.0.0"
description = "Question answering over the uv docs with verified citations: incremental ingestion, hybrid retrieval, guardrails, SSE API, evals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5,<3",
    "httpx>=0.28,<1",
    "tiktoken>=0.14,<1",
    "bm25s>=0.3,<0.4",
    "PyStemmer>=2.2,<3",
    "sentence-transformers>=6.0,<7",
    "torch>=2.14,<3",
    "openai>=3.13,<4",
    "fastapi>=0.141,<1",
    "pydantic>=2.13,<3",
    "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "ruff>=0.16,<1",
]

[project.scripts]
rag-assistant = "rag_assistant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]          # run `pytest` from a source checkout without installing the package
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: needs a reachable LLM server and a built index; skipped otherwise"]
filterwarnings = [
    "error::DeprecationWarning:rag_assistant",  # our own code must not use deprecated APIs
    # third-party: starlette's TestClient touches an alias that anyio deprecated (not fixable in this project)
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 160
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
