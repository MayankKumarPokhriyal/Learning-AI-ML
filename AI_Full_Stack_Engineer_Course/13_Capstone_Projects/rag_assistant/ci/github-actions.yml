# Example CI pipeline. To use it, copy this file to .github/workflows/ci.yml at the root of your repository.
# If the project is not at the repository root, set PROJECT_DIR below to its folder.
name: rag-assistant-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:          # run the answer-quality evaluation by hand
  schedule:
    - cron: "0 3 * * 1"       # and once a week

env:
  PROJECT_DIR: .
  UV_TORCH_BACKEND: cpu       # CI runners have no GPU: install CPU-only PyTorch wheels

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Ruff lint
        run: uvx ruff@0.16.7 check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked runtime dependencies + dev tools
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[dev]" -c requirements.lock
      - name: Unit + API tests (test doubles, no network; the live test skips itself)
        run: .venv/bin/python -m pytest

  retrieval-gate:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e . -c requirements.lock
      - name: Cache the embedding model and reranker
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5-ms-marco-MiniLM-L6-v2
      - name: Download the pinned uv docs and build the index
        run: |
          .venv/bin/python -m rag_assistant download
          .venv/bin/python -m rag_assistant ingest
      - name: Retrieval evaluation (deterministic, no LLM needed)
        run: .venv/bin/python -m rag_assistant eval --retrieval-only --name ci-retrieval --out reports
      - name: Regression gate on retrieval metrics
        run: .venv/bin/python -m rag_assistant gate reports/eval_ci-retrieval.json --retrieval-only
      - name: Keep the corpus and index for the next jobs
        uses: actions/upload-artifact@v7
        with:
          name: rag-data
          path: ${{ env.PROJECT_DIR }}/data/
          retention-days: 7

  answer-gate:
    # Full evaluation with the LLM judge. It needs an OpenAI-compatible endpoint, so it runs on a schedule or by hand, not on every PR.
    needs: retrieval-gate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT }}
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e . -c requirements.lock
      - uses: actions/download-artifact@v8
        with:
          name: rag-data
          path: ${{ env.PROJECT_DIR }}/data/
      - name: Answer evaluation with the LLM judge
        run: .venv/bin/python -m rag_assistant eval --judge --name ci-answers --out reports
      - name: Regression gate on all metrics
        run: .venv/bin/python -m rag_assistant gate reports/eval_ci-answers.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-report
          path: ${{ env.PROJECT_DIR }}/reports/

  build:
    needs: retrieval-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: rag-data
          path: ${{ env.PROJECT_DIR }}/data/
      - name: Build image
        run: docker build -t rag-assistant:${{ github.sha }} .
      - name: "Smoke test the container (no LLM here: readiness, non-root user and input limits)"
        run: |
          docker run -d --name rag -p 8000:8000 rag-assistant:${{ github.sha }}
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/ready && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/health
          test "$(docker exec rag id -u)" != "0"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8000/ask -H "content-type: application/json" \
            -d "{\"question\": \"$(printf 'x%.0s' $(seq 1 1200))\"}")
          test "$code" = "413"
          docker rm -f rag
      # Next step in a real project: push to a registry (e.g. docker/login-action + docker push) on main only
